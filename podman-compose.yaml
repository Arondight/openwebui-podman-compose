networks:
  openwebui_network:
    driver: bridge

services:
  openwebui:
    container_name: openwebui
    environment:
      WEBUI_SECRET_KEY: "aea3eeac-39a1-4e44-b1ac-9bf344070ebc"
      OLLAMA_BASE_URL: "http://192.168.1.113:11434"
      USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36 Edg/143.0.0.0"
      HF_ENDPOINT: "https://hf-mirror.com"
      #BYPASS_MODEL_ACCESS_CONTROL: true
    image: ghcr.io/open-webui/open-webui:main
    networks:
      - openwebui_network
    restart: unless-stopped
    volumes:
      - ./data:/app/backend/data
    ports:
      - "3000:8080"

  # Settings                      Value
  #
  # Text-to-Speech Engine (URL) : http://openwebui-kokoro-fastapi-cpu:8880/v1
  # Text-to-Speech Engine (KEY) : not-needed
  # TTS Voice                   : zf_xiaoxiao (for Chinese)
  # TTS Model                   : kokoro
  openwebui-kokoro-fastapi-cpu:
    container_name: openwebui-kokoro-fastapi-cpu
    environment:
      ONNX_EXECUTION_MODE: "parallel"
      ONNX_OPTIMIZATION_LEVEL: "all"
      ONNX_MEMORY_PATTERN: true
      API_LOG_LEVEL: "DEBUG"
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    networks:
      - openwebui_network
    restart: unless-stopped
    ports:
      - "8880:8880"

  # Settings                      Value
  #
  # Web Search                  : <ON>
  # Web Search Engine           : searxng
  # Searxng Query URL           : http://openwebui-searxng:8080/search?q=<query>
  openwebui-searxng:
    container_name: openwebui-searxng
    image: ghcr.io/searxng/searxng:latest
    networks:
      - openwebui_network
    restart: unless-stopped
    ports:
      - "8881:8080"
    volumes:
      - ./searxng:/etc/searxng:Z
    environment:
      SEARXNG_BASE_URL: http://localhost:8881/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  # Settings                      Value
  #
  # URL                         : http://openwebui-openterminal:8000
  # Auth                        : Bearer
  # API Key                     : 254b0775-5e72-4779-bcb3-985abf754c3f
  openwebui-openterminal:
    container_name: openwebui-openterminal
    image: ghcr.io/open-webui/open-terminal:latest
    networks:
      - openwebui_network
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: 254b0775-5e72-4779-bcb3-985abf754c3f
      OPEN_TERMINAL_MULTI_USER: "true"
    volumes:
      - ./openterminal:/home:Z
    ports:
      - "8882:8000"
